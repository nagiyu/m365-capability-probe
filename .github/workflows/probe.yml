# Runs the probe from a dispatch instead of from a debugger.
#
# The delegated leg is a device code flow, and device code needs a person. This workflow does not
# pretend otherwise: it prints the code into the job log and waits for someone to complete the
# sign-in in a browser. Nothing here is unattended, and a run nobody is watching will spend the
# code's lifetime waiting and then report the delegated column as refused.
name: capability probe

on:
  workflow_dispatch:
    inputs:
      subcommand:
        description: "What to measure"
        type: choice
        options: [auth, access, sharepoint, acl, mip, consume, inventory, promotion]
        default: auth
        required: true
      # Not required: 'mip' and 'consume' never touch a site, and a form cannot ask for a value only
      # for some choices. Left empty where it is needed, the probe stops and names the missing key.
      site_url:
        description: "SiteUrl - https://<host>/sites/<name> (auth, access, sharepoint, acl, inventory, promotion)"
        type: string
        required: false
        default: ""
      identities:
        description: "Which identities to establish. 'all' needs a person to complete a device code in this log."
        type: choice
        options: [app-only, all]
        default: app-only
        required: true
      # Not marked required: a dispatch form cannot ask for it only when identities=all, and an
      # app-only run has no delegated leg to name an account for. Left empty with identities=all,
      # the probe stops on its own and says which key is missing.
      delegated_user_hint:
        description: "DelegatedUserHint - the sign-in name to complete the device code with (identities=all only)"
        type: string
        required: false
        default: ""
      file_paths:
        description: "FilePaths - access and promotion. Several allowed, separated by '|' (the full-width | is accepted too). No library name. e.g. /a.docx|/sub/b.docx. promotion reads them all in one call sequence, so they are compared at one moment."
        type: string
        required: false
        default: ""
      delegated_user_emails:
        description: "consume only. Addresses to put in DelegatedUserEmail, separated by '|'. A leg with it unset is added automatically."
        type: string
        required: false
        default: ""
      mip_identity_email:
        description: "consume only, optional. Pins FileEngineSettings.Identity so only DelegatedUserEmail varies between legs."
        type: string
        required: false
        default: ""
      protected_site_files:
        description: "consume only. Paths to the protected files in the site's document library, separated by '|', e.g. /a.docx|/b.docx. Needs site_url. Several are opened in one run, by the same legs, so a difference between them is about the files."
        type: string
        required: false
        default: ""
      page_size:
        description: "acl only, optional. $top for every collection. Set it small (e.g. 2) to make a library too small to page on its own page anyway. Empty takes whatever the service calls a page."
        type: string
        required: false
        default: ""
      page_limit:
        description: "acl only, optional. How many pages a route may follow before stopping. Reaching it is reported as reaching it, never as the end of the collection. Empty means 20."
        type: string
        required: false
        default: ""

permissions:
  contents: read

# The run parks on a device code prompt. Two of those in flight at once means two codes in two
# logs and no way to tell which one the browser is about to consume.
concurrency:
  group: capability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest

    # The device code itself expires in about 15 minutes. This bounds the whole job a little past
    # that, so a run nobody attended ends on its own rather than holding a runner.
    timeout-minutes: 25

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Restore and build before the probe step, not inside it. The person completing the sign-in
      # gets the code's full lifetime to do it, rather than losing the first minute of it to NuGet.
      - name: Build
        run: dotnet build M365CapabilityProbe.sln -c Release

      # The certificate leg needs a file, and a repository secret is a string. Base64 in the secret,
      # a file on the runner, and the path handed over the same way every other setting is - so the
      # tool has one input and one code path whether it runs here or on a laptop.
      #
      # Written under RUNNER_TEMP, which is wiped with the runner. Nothing is committed, and the
      # path never leaves this job.
      - name: Materialise the client certificate
        env:
          PFX_BASE64: ${{ secrets.PROBE_CLIENTCERTIFICATE }}
        run: |
          set -eu

          # The absence of the secret is not an error. It is the ordinary case, and the report says
          # so on its own - so this step reports it too rather than looking like it did something.
          if [ -z "${PFX_BASE64:-}" ]; then
            echo "No PROBE_CLIENTCERTIFICATE secret is set."
            echo "The certificate leg will report itself as not run, with that as the reason."
            exit 0
          fi

          # Whitespace is stripped first: base64 wrapped at 76 characters is the same value as base64
          # on one line, and which one lands in the secret depends on which tool produced it.
          # A PEM-style BEGIN/END block is not handled - those lines are not whitespace, and a
          # certificate that decodes to nothing would be worse than one that fails here.
          printf '%s' "$PFX_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/probe.pfx"
          echo "PROBE_CLIENTCERTIFICATEPATH=$RUNNER_TEMP/probe.pfx" >> "$GITHUB_ENV"
          echo "Wrote a $(wc -c < "$RUNNER_TEMP/probe.pfx") byte certificate file."
          echo "If it is not a PKCS#12 file, or the password is wrong, the report says so as a"
          echo "not-run row with the reason. It does not fail the job: that is a measurement too."

      # The Information Protection SDK is native code, and these are what its libraries link against -
      # read out of the binaries with objdump, and checked at run time by the 'mip' subcommand. Only
      # the two subcommands that touch the SDK pay for this.
      - name: Install what the Information Protection SDK links against
        if: ${{ inputs.subcommand == 'mip' || inputs.subcommand == 'consume' }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsecret-1-0 libgsf-1-114 libgmime-3.0-0

      - name: Materialise the inventory certificate
        env:
          PFX_BASE64: ${{ secrets.PROBE_INVENTORYCERTIFICATE }}
        run: |
          set -eu

          # Absent is the ordinary case: 'inventory' falls back to the probe's own registration and
          # says in its report that it did. Only that subcommand looks at this at all.
          if [ -z "${PFX_BASE64:-}" ]; then
            echo "No PROBE_INVENTORYCERTIFICATE secret is set."
            echo "'inventory' will speak as the probe's own app registration, and will say so."
            exit 0
          fi

          printf '%s' "$PFX_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/inventory.pfx"
          echo "PROBE_INVENTORYCERTIFICATEPATH=$RUNNER_TEMP/inventory.pfx" >> "$GITHUB_ENV"
          echo "Wrote a $(wc -c < "$RUNNER_TEMP/inventory.pfx") byte certificate file for the inventory app."

      - name: Say what to watch for
        env:
          IDENTITIES: ${{ inputs.identities }}
          HINT: ${{ inputs.delegated_user_hint }}
          SUBCOMMAND: ${{ inputs.subcommand }}
        run: |
          set -eu
          # 'mip' and 'consume' have no delegated leg at all, so identities does not reach them.
          # Telling someone to watch for a device code that will never be printed is worse than
          # saying nothing.
          if [ "$SUBCOMMAND" = "mip" ] || [ "$SUBCOMMAND" = "consume" ]; then
            echo "$SUBCOMMAND has no delegated leg: no device code will be printed, and nobody"
            echo "needs to watch this log."
            if [ "$SUBCOMMAND" = "consume" ]; then
              echo
              echo "The file is not a secret: it is fetched from the site's document library with the"
              echo "app's own token, at the paths given as protected_site_files, and deleted when the run"
              echo "ends. Which file is being opened is what this run is about, so it is an input."
            fi
          elif [ "$IDENTITIES" = "all" ]; then
            echo "The next step requests app-only tokens first, then stops and prints a device code."
            echo "Open the URL it prints, enter the code, and sign in as: $HINT"
            echo "Signing in as anyone else measures that person's reach instead. The report records"
            echo "which account actually completed the sign-in, so a run is never silently about someone else."
          else
            echo "identities=app-only: no device code will be printed and nobody needs to watch this log."
            echo "The delegated rows will appear as not run, saying that is what this run was asked for."
            echo "That is a narrower run, not a failed one - it still exits 0."
          fi

      - name: Probe
        # The delegated sign-in is the long pole. Bounded here so a timeout is attributed to the
        # wait for a person and not to the job as a whole.
        timeout-minutes: 20
        env:
          # Only the values that never change per run are secrets. SiteUrl, FilePaths and
          # DelegatedUserHint are what a given run is about, so they are dispatch inputs.
          # PROBE_CLIENTCERTIFICATEPATH is not here: the step above puts it in the environment, and
          # only when there was a certificate to write.
          PROBE_TENANTID: ${{ secrets.PROBE_TENANTID }}
          PROBE_CLIENTID: ${{ secrets.PROBE_CLIENTID }}
          PROBE_CLIENTSECRET: ${{ secrets.PROBE_CLIENTSECRET }}
          PROBE_CLIENTCERTIFICATEPASSWORD: ${{ secrets.PROBE_CLIENTCERTIFICATEPASSWORD }}
          PROBE_SITEURL: ${{ inputs.site_url }}
          PROBE_FILEPATHS: ${{ inputs.file_paths }}
          PROBE_DELEGATEDUSERHINT: ${{ inputs.delegated_user_hint }}
          PROBE_IDENTITIES: ${{ inputs.identities }}
          PROBE_DELEGATEDUSEREMAILS: ${{ inputs.delegated_user_emails }}
          PROBE_MIPIDENTITYEMAIL: ${{ inputs.mip_identity_email }}
          PROBE_PROTECTEDSITEFILES: ${{ inputs.protected_site_files }}
          PROBE_INVENTORYCLIENTID: ${{ secrets.PROBE_INVENTORYCLIENTID }}
          PROBE_INVENTORYCERTIFICATEPASSWORD: ${{ secrets.PROBE_INVENTORYCERTIFICATEPASSWORD }}
          PROBE_PAGESIZE: ${{ inputs.page_size }}
          PROBE_PAGELIMIT: ${{ inputs.page_limit }}
          # Not PROBE_-prefixed: that prefix is the configuration binder's, and this is not a setting.
          SUBCOMMAND: ${{ inputs.subcommand }}
        run: |
          set -u
          status=0
          dotnet run --project src/CapabilityProbe.Cli -c Release --no-build -- "$SUBCOMMAND" || status=$?

          # The exit code says whether the probe could do its job, not whether the tenant behaved.
          # A refusal, an empty list, a 404, a token carrying nothing, and a step left unreachable by
          # one of those are all measurements, and all exit 0. Read the tables for what was found;
          # read this only for whether the probe got to run.
          echo
          case "$status" in
            0)   echo "exit 0   - the probe ran; the findings are in the tables above" ;;
            2)   echo "exit 2   - the delegated sign-in was never completed, so the delegated half is empty" ;;
            64)  echo "exit 64  - bad usage" ;;
            78)  echo "exit 78  - configuration is incomplete; the missing keys are listed above" ;;
            130) echo "exit 130 - cancelled" ;;
            *)   echo "exit $status" ;;
          esac

          echo
          echo "A refusal seen here and not seen locally is not automatically a permission finding:"
          echo "this ran from a GitHub-hosted runner, so the source IP and device differ from your"
          echo "machine, and a conditional access policy can refuse on those grounds alone."
          echo
          echo "Also: Actions masks its secrets in this log, and a service can put one of them inside"
          echo "a value the probe measured - SharePoint names the tenant in its WWW-Authenticate realm."
          echo "Masked text is replaced after the line is written, so a table whose columns no longer"
          echo "line up is the sign that it happened. Run locally to read a value that comes back ***."

          exit $status

      # The log holds the tables; this holds the measurement. A run that is only a log can be read
      # but not compared - and comparing two runs across a change is how this repository establishes
      # most of what it knows (findings 5, 6, 7, 8). Kept even when the probe exited non-zero,
      # because an incomplete run is still the record of what did happen before it stopped.
      #
      # The JSON carries no secret: bearer tokens are recorded as a length, and the certificate as
      # its thumbprint, subject and expiry - all public-key side values. It does carry tenant and
      # site names, which the log masks and this does not, so it is worth knowing that a download
      # says more than the page it came from.
      - name: Keep the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.subcommand }}-${{ github.run_number }}
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 90
