# Runs the probe from a dispatch instead of from a debugger.
#
# The delegated leg is a device code flow, and device code needs a person. This workflow does not
# pretend otherwise: it prints the code into the job log and waits for someone to complete the
# sign-in in a browser. Nothing here is unattended, and a run nobody is watching will spend the
# code's lifetime waiting and then report the delegated column as refused.
name: capability probe

on:
  workflow_dispatch:
    inputs:
      subcommand:
        description: "What to measure"
        type: choice
        options: [auth, access, sharepoint]
        default: auth
        required: true
      site_url:
        description: "SiteUrl - https://<host>/sites/<name>"
        type: string
        required: true
      delegated_user_hint:
        description: "DelegatedUserHint - the sign-in name the delegated leg should be completed with"
        type: string
        required: true
      file_paths:
        description: "FilePaths - access only. Several allowed, separated by '|'. No library name. e.g. /a.docx|/sub/b.docx"
        type: string
        required: false
        default: ""

permissions:
  contents: read

# The run parks on a device code prompt. Two of those in flight at once means two codes in two
# logs and no way to tell which one the browser is about to consume.
concurrency:
  group: capability-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest

    # The device code itself expires in about 15 minutes. This bounds the whole job a little past
    # that, so a run nobody attended ends on its own rather than holding a runner.
    timeout-minutes: 25

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Restore and build before the probe step, not inside it. The person completing the sign-in
      # gets the code's full lifetime to do it, rather than losing the first minute of it to NuGet.
      - name: Build
        run: dotnet build M365CapabilityProbe.sln -c Release

      # The certificate leg needs a file, and a repository secret is a string. Base64 in the secret,
      # a file on the runner, and the path handed over the same way every other setting is - so the
      # tool has one input and one code path whether it runs here or on a laptop.
      #
      # Written under RUNNER_TEMP, which is wiped with the runner. Nothing is committed, and the
      # path never leaves this job.
      - name: Materialise the client certificate
        env:
          PFX_BASE64: ${{ secrets.PROBE_CLIENTCERTIFICATE }}
        run: |
          set -eu

          # The absence of the secret is not an error. It is the ordinary case, and the report says
          # so on its own - so this step reports it too rather than looking like it did something.
          if [ -z "${PFX_BASE64:-}" ]; then
            echo "No PROBE_CLIENTCERTIFICATE secret is set."
            echo "The certificate leg will report itself as not run, with that as the reason."
            exit 0
          fi

          printf '%s' "$PFX_BASE64" | base64 -d > "$RUNNER_TEMP/probe.pfx"
          echo "PROBE_CLIENTCERTIFICATEPATH=$RUNNER_TEMP/probe.pfx" >> "$GITHUB_ENV"
          echo "Wrote a $(wc -c < "$RUNNER_TEMP/probe.pfx") byte certificate file."
          echo "If it is not a PKCS#12 file, or the password is wrong, the report says so as a"
          echo "not-run row with the reason. It does not fail the job: that is a measurement too."

      - name: Say what to watch for
        run: |
          echo "The next step requests app-only tokens first, then stops and prints a device code."
          echo "Open the URL it prints, enter the code, and sign in as: ${{ inputs.delegated_user_hint }}"
          echo "Signing in as anyone else measures that person's reach instead. The report records"
          echo "which account actually completed the sign-in, so a run is never silently about someone else."

      - name: Probe
        # The delegated sign-in is the long pole. Bounded here so a timeout is attributed to the
        # wait for a person and not to the job as a whole.
        timeout-minutes: 20
        env:
          # Only the values that never change per run are secrets. SiteUrl, FilePaths and
          # DelegatedUserHint are what a given run is about, so they are dispatch inputs.
          # PROBE_CLIENTCERTIFICATEPATH is not here: the step above puts it in the environment, and
          # only when there was a certificate to write.
          PROBE_TENANTID: ${{ secrets.PROBE_TENANTID }}
          PROBE_CLIENTID: ${{ secrets.PROBE_CLIENTID }}
          PROBE_CLIENTSECRET: ${{ secrets.PROBE_CLIENTSECRET }}
          PROBE_CLIENTCERTIFICATEPASSWORD: ${{ secrets.PROBE_CLIENTCERTIFICATEPASSWORD }}
          PROBE_SITEURL: ${{ inputs.site_url }}
          PROBE_FILEPATHS: ${{ inputs.file_paths }}
          PROBE_DELEGATEDUSERHINT: ${{ inputs.delegated_user_hint }}
          # Not PROBE_-prefixed: that prefix is the configuration binder's, and this is not a setting.
          SUBCOMMAND: ${{ inputs.subcommand }}
        run: |
          set -u
          status=0
          dotnet run --project src/CapabilityProbe.Cli -c Release --no-build -- "$SUBCOMMAND" || status=$?

          # The exit code says whether the probe could do its job, not whether the tenant behaved.
          # A refusal, an empty list, a 404, a token carrying nothing, and a step left unreachable by
          # one of those are all measurements, and all exit 0. Read the tables for what was found;
          # read this only for whether the probe got to run.
          echo
          case "$status" in
            0)   echo "exit 0   - the probe ran; the findings are in the tables above" ;;
            2)   echo "exit 2   - the delegated sign-in was never completed, so the delegated half is empty" ;;
            64)  echo "exit 64  - bad usage" ;;
            78)  echo "exit 78  - configuration is incomplete; the missing keys are listed above" ;;
            130) echo "exit 130 - cancelled" ;;
            *)   echo "exit $status" ;;
          esac

          echo
          echo "A refusal seen here and not seen locally is not automatically a permission finding:"
          echo "this ran from a GitHub-hosted runner, so the source IP and device differ from your"
          echo "machine, and a conditional access policy can refuse on those grounds alone."
          echo
          echo "Also: Actions masks its secrets in this log, and a service can put one of them inside"
          echo "a value the probe measured - SharePoint names the tenant in its WWW-Authenticate realm."
          echo "Masked text is replaced after the line is written, so a table whose columns no longer"
          echo "line up is the sign that it happened. Run locally to read a value that comes back ***."

          exit $status
